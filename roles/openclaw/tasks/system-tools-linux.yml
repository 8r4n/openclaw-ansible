---
# Linux-specific system tools installation

- name: Install essential system tools (Debian/Ubuntu - apt)
  ansible.builtin.apt:
    name:
      # Editors
      - vim
      - nano
      # Version control
      - git
      - git-lfs
      # Network tools
      - curl
      - wget
      - netcat-openbsd
      - net-tools
      - dnsutils
      - iputils-ping
      - traceroute
      - tcpdump
      - nmap
      - socat
      - telnet
      # Debugging tools
      - strace
      - lsof
      - gdb
      - htop
      - iotop
      - iftop
      - sysstat
      - procps
      # System utilities
      - tmux
      - tree
      - jq
      - unzip
      - rsync
      - less
      # Build essentials for development
      - build-essential
      - file
    state: present
    update_cache: true
  when: ansible_os_family == 'Debian'

- name: Install essential system tools (Fedora - dnf)
  ansible.builtin.dnf:
    name:
      # Editors
      - vim
      - nano
      # Version control
      - git
      - git-lfs
      # Network tools
      - curl
      - wget
      - nmap-ncat
      - net-tools
      - bind-utils
      - iputils
      - traceroute
      - tcpdump
      - nmap
      - socat
      - telnet
      # Debugging tools
      - strace
      - lsof
      - gdb
      - htop
      - iotop
      - iftop
      - sysstat
      - procps-ng
      # System utilities
      - tmux
      - tree
      - jq
      - unzip
      - rsync
      - less
      - file
    state: present
  when: ansible_os_family == 'RedHat'

- name: Install development tools group (Fedora - dnf)
  ansible.builtin.dnf:
    name: "@development-tools"
    state: present
  when: ansible_os_family == 'RedHat'

- name: Deploy global vim configuration (Debian/Ubuntu)
  ansible.builtin.template:
    src: vimrc.j2
    dest: /etc/vim/vimrc.local
    owner: root
    group: root
    mode: '0644'
  when: ansible_os_family == 'Debian'

- name: Deploy global vim configuration (Fedora)
  ansible.builtin.template:
    src: vimrc.j2
    dest: /etc/vimrc.local
    owner: root
    group: root
    mode: '0644'
  when: ansible_os_family == 'RedHat'
